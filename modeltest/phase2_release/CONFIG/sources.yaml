  status: AUTHORIZATION_PENDING
  selector_profile: null
  permission_status: NOT_GRANTED
  request_delay_seconds: 2
  timeout_seconds: 30
  max_retries: 3
  endpoint_template: https://client.ndc.navitaire.com/v21.3/AirShopping
  auth_endpoint: https://client.ndc.navitaire.com/v21.3/Authentication
  api_version: "21.3"
  live_enabled: false
  notes: "Enable only after documented IndiGo NDC authorization, credentials, IP whitelisting and required certification/approval."
